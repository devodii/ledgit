services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${PGSCHEMA_IMAGE:-pgplex/pgschema:latest}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - apply
      - --host=db
      - --port=5432
      - --db=${POSTGRES_DB}
      - --user=${POSTGRES_USER}
      - --schema=public
      - --sslmode=disable
      - --file=/db/schema/manifest.sql
      - --auto-approve
    working_dir: /db
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  dbdata:
