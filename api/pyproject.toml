[project]
name = "ledgit-api"
version = "0.1.0"
description = "Ledgit API: checks claims made at Stellar events against on-chain evidence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "apscheduler>=3.10",
  "playwright>=1.48",
  "pyyaml>=6.0",
  "yt-dlp>=2026.10.26",
  "pillow>=13.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml",
]

[project.scripts]
receipts = "receipts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["receipts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.per-file-ignores]
"receipts/pipeline/resolve.py" = ["E501", "SIM105"]
"receipts/pipeline/domain.py" = ["E501"]
"receipts/pipeline/relevance.py" = ["E501"]
"receipts/api/seo.py" = ["E501"]
"receipts/pipeline/extract.py" = ["E501"]
"receipts/pipeline/judge.py" = ["E501"]
"receipts/evals/report.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses".msg = "Use pydantic models instead of dataclasses."

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*", "apscheduler.*"]
ignore_missing_imports = true
