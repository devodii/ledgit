repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd api && uv run ruff format .'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd api && uv run ruff check . --fix'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
      - id: web-format
        name: prettier
        entry: bash -c 'cd web && pnpm format'
        language: system
        files: ^web/
        pass_filenames: false
      - id: web-lint
        name: eslint and stylelint
        entry: bash -c 'cd web && pnpm lint && pnpm lint:styles'
        language: system
        files: ^web/
        pass_filenames: false
